<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Máquina LLM</title>
    <link rel="stylesheet/less" type="text/css" href="/main.less" />
    <script src="less.js"></script>
</head>

<body>

    <div id="main">

        <div class="text">

            <div id="prompt" contenteditable="true">Y dijo el toro al morir</div>

        </div>
        <div class="aside">
            <header>
                <h1>Máquina LLM</h1>
            </header>
            <label>
                Model
                <input id="model" value="cambiar a selector" />
            </label>

            <div class="settings">
            <label>
                Temperature:
                <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7"
                    oninput="updateValue(this)">
                <span class="range-value">0.7</span>
            </label>

            <label>
                Top P:
                <input type="range" id="top_p" min="0" max="1" step="0.1" value="1" oninput="updateValue(this)">
                <span class="range-value">1.0</span>
            </label>

            <label>
                Top K:
                <input type="range" id="top_k" min="0" max="500" step="1" value="10" oninput="updateValue(this,true)" />
                <span class="range-value">10</span>
            </label>

            <label>
                Repetition penalty:<small>(same word again and again)</small>
                <input type="range" id="frequency_penalty" min="-2" max="2" step="0.1" value="0"
                    oninput="updateValue(this)">
                <span class="range-value">0.0</span>
            </label>

            <label>
                Reuse penalty: <small>(avoid previously used words)</small>
                <input type="range" id="presence_penalty" min="-2" max="2" step="0.1" value="0"
                    oninput="updateValue(this)">
                <span class="range-value">0.0</span>
            </label>

            <label>
                Max tokens:
                <input type="number" id="max_tokens" value="20" min="1">
            </label>

            </div>
            <button onclick="generate()">Generate</button>
        </div>

    </div>

    <h3>Logs</h3>
    <pre id="output"></pre>


    <script src="script.js"></script>
</body>

</html>
