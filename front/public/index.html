<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Gerineldo v1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet/less" type="text/css" href="main.less" />
    <script src="less.js"></script>
</head>

<body>

    <div id="main">

        <div class="text">

            <div id="prompt" contenteditable="true">Y dijo el toro al morir</div>

        </div>
        <div class="aside">
            <header>
                <h1>Máquina LLM</h1>
            </header>
          <label class="selector">
    API URL<br>
    <input id="api_url" type="text" placeholder="http://127.0.0.1:1234" />
</label>

          <label class="selector">
    Model<br>
    <select id="model"></select>
</label>

            <div class="settings">
            <label>
                <span class="labelname">Temperature:</span>  <span class="range-value">0.7</span>
                <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7"
                    oninput="updateValue(this)">
               
            </label>

            <label>
                 <span class="labelname">Top P:</span>   <span class="range-value">1.0</span>
                <input type="range" id="top_p" min="0" max="1" step="0.1" value="1" oninput="updateValue(this)">
              
            </label>

            <label> 
                 <span class="labelname">Top K:</span>   <span class="range-value">10</span>
                <input type="range" id="top_k" min="0" max="500" step="1" value="10" oninput="updateValue(this,true)" />
              
            </label>

            <label>
                 <span class="labelname">Repetition penalty:</span>     <span class="range-value">0.0</span>
                <input type="range" id="frequency_penalty" min="-2" max="2" step="0.1" value="0"
                    oninput="updateValue(this)">
            
            </label>

            <label>
                 <span class="labelname">Reuse penalty: </span>  <span class="range-value">0.0</span>
                <input type="range" id="presence_penalty" min="-2" max="2" step="0.1" value="0"
                    oninput="updateValue(this)">
               
            </label>

            <label>
                Max tokens:
                <input type="number" id="max_tokens" value="20" min="1">
            </label>

            </div>
            <button id="generateBtn" onclick="generate()">Generate</button>
        </div>

    </div>

    <h3>Logs</h3>
    <pre id="output"></pre>


    <script src="script.js"></script>
</body>

</html>
